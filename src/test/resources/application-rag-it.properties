# RAG 통합 스모크 테스트 프로필.
# @ActiveProfiles({"test","rag-it"}) 와 함께 사용 — test 가 H2/AWS dummy,
# rag-it 가 RAG 활성화 + 실 키 주입. 환경변수 미설정 시 IT 는 가드(@EnabledIfEnv)로 skip.

posture.rag.enabled=true
posture.rag.top-k=4
posture.rag.timeout-seconds=15
posture.rag.embedding-model=text-embedding-3-large
posture.rag.hyde-enabled=${POSTURE_RAG_HYDE_ENABLED:false}
posture.rag.hyde-model=gpt-5.4-mini-2026-03-17
posture.rag.hyde-reasoning-effort=none
posture.rag.hyde-timeout-seconds=15

spring.ai.openai.api-key=${OPENAI_API_KEY:}
# rag-it 는 실 OpenAI 호출 IT 이므로 test 프로필의 test-model 더미를 다시 env 기반으로 덮어쓴다.
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-5.5}
posture.llm.timeout-seconds=60

pinecone.api-key=${PINECONE_API_KEY:}
pinecone.index-name=capstone2-posture-analyze-rag
pinecone.index-host=${PINECONE_INDEX_HOST:}
pinecone.namespace=v1
