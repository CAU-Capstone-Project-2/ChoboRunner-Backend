# Integration test profile — H2 in-memory, AWS/AI/LLM 외부 의존 무효화
spring.datasource.url=jdbc:h2:mem:itest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

app.api-key=test-api-key
app.websocket.max-message-size-bytes=10485760

# AI/LLM 외부 의존성 차단 (단순 문자열만 채워 빈 검증 통과)
ai-server.ws-url=ws://localhost:0/ws/test
ai-server.overlay-url=http://localhost:0/test/overlay
spring.ai.openai.api-key=
spring.ai.openai.chat.options.model=test-model
spring.ai.openai.chat.options.temperature=0.3
posture.llm.timeout-seconds=1
posture.overlay.timeout-seconds=1

# AWS 더미 자격 증명 — S3Service 가 의존하는 S3Client 자동구성만 만족시킴 (실호출 없음)
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.s3.region=ap-northeast-2
cloud.aws.s3.bucket=test-bucket
cloud.aws.region.static=ap-northeast-2
cloud.aws.s3.stack.auto=false

openapi.server-local-url=http://localhost:8080
openapi.server-https-url=http://localhost:8080
