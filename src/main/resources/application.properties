spring.application.name=server
server.port=8080
openapi.server-local-url=http://localhost:8080
openapi.server-https-url=https://capstone2-backend.foopky.com

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/choborunner?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

ai-server.ws-url=${AI_SERVER_WS_URL:ws://localhost:8000/ws/inference}
ai-server.overlay-url=${AI_SERVER_OVERLAY_URL:http://localhost:8000/analyze/overlay}

# === 영상 오버레이 ===
posture.overlay.timeout-seconds=600
spring.mvc.async.request-timeout=600000

# === 하이라이트 캡처 ===
posture.highlight.gap-threshold-sec=${POSTURE_HIGHLIGHT_GAP_THRESHOLD_SEC:6.0}
posture.highlight.min-duration-sec=${POSTURE_HIGHLIGHT_MIN_DURATION_SEC:3.0}
posture.highlight.start-padding-sec=${POSTURE_HIGHLIGHT_START_PADDING_SEC:1.0}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
app.websocket.max-message-size-bytes=10485760

app.api-key=${APP_API_KEY}

cloud.aws.s3.bucket=capstone2-s3-bucket
cloud.aws.region.static=ap-northeast-2
cloud.aws.s3.stack.auto=false

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=WARN
logging.level.capstone2.server=INFO

# === LLM (OpenAI via WebClient) ===
# 자세 분석 임계치/Verdict 판정은 AI 서버가 관리한다(v3). 백엔드는 score 참조값만 상수로 보존.
posture.llm.timeout-seconds=60
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-5.5}
# gpt-5.x reasoning 계열은 temperature 1.0 만 허용 (다른 값 보내면 400).
# 결정적 응답은 response_format=json_object + SYSTEM_PROMPT 출력 제약으로 확보.
spring.ai.openai.chat.options.temperature=1.0

# === RAG / Pinecone ===
# 기본 false. RAG 도입 후 운영 환경에서만 true.
posture.rag.enabled=${POSTURE_RAG_ENABLED:false}
posture.rag.top-k=4
posture.rag.timeout-seconds=10
posture.rag.embedding-model=text-embedding-3-large

pinecone.api-key=${PINECONE_API_KEY:}
pinecone.index-name=${PINECONE_INDEX_NAME:capstone2-posture-analyze-rag}
pinecone.index-host=${PINECONE_INDEX_HOST:}
pinecone.namespace=${PINECONE_NAMESPACE:v1}